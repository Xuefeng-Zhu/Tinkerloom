name: Verify

on:
  push:
    branches: [main, codex/flutter-appwrite-port]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter client and shared renderer (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "1"
      TINKERLOOM_ALLOW_CLOUD_TESTS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Flutter 3.47.0 / Dart 3.13
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "4cf24164269a5ebf0c16a028a00727d0e77bbb05"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify Flutter version
        run: flutter --version
      - name: Analyze, test and build web without Appwrite calls
        run: bash scripts/verify.sh --client-only

  backend:
    name: Appwrite service and contract (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      TINKERLOOM_ALLOW_CLOUD_TESTS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Cloud-compatible Dart 3.11
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.11"
      - name: Set up Node.js 24 for offline service bridges
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Analyze, test and compile backend without Appwrite calls
        run: bash scripts/verify.sh --backend-only
